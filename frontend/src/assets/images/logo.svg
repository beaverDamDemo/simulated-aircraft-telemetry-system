<svg width="900" height="220" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients -->
    <linearGradient id="planeGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#41B883"/>
      <stop offset="100%" stop-color="#34495E"/>
    </linearGradient>

    <linearGradient id="signalGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#41B883"/>
      <stop offset="50%" stop-color="#00B4D8"/>
      <stop offset="100%" stop-color="#34495E"/>
    </linearGradient>

    <linearGradient id="groundGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#41B883"/>
      <stop offset="100%" stop-color="#00B4D8"/>
    </linearGradient>

    <!-- Text styling -->
    <style>
      .logo-main {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-weight: 600;
        letter-spacing: 0.02em;
      }
      .logo-main-1 {
        fill: #41B883;
      }
      .logo-main-2 {
        fill: #00A8CC;
      }
    </style>
  </defs>

  <!-- Left graphic group -->
  <g transform="translate(40,30)">
    <!-- Mountains -->
    <polygon points="0,120 55,40 110,120" fill="#2F855A"/>
    <polygon points="70,120 130,50 190,120" fill="#41B883"/>

    <!-- Ground swoosh -->
    <path d="M-10,130 C60,150 150,155 240,140 
             C280,132 320,120 360,118 
             L360,160 L-10,160 Z"
          fill="url(#groundGradient)" opacity="0.9"/>

    <!-- Telemetry signal arcs -->
    <g transform="translate(150,40)" fill="none" stroke="url(#signalGradient)" stroke-width="5">
      <path d="M0,60 A60,60 0 0 1 90,60" opacity="0.35"/>
      <path d="M10,45 A45,45 0 0 1 80,45" opacity="0.55"/>
      <path d="M20,30 A30,30 0 0 1 70,30" opacity="0.8"/>
    </g>

    <!-- Airplane -->
    <g transform="translate(150,10) rotate(-15)">
      <!-- Fuselage -->
      <rect x="0" y="30" width="110" height="16" rx="8" fill="white"/>
      <!-- Nose -->
      <path d="M110,30 L130,38 L110,46 Z" fill="white"/>
      <!-- Tail fin -->
      <polygon points="10,20 35,20 25,40" fill="url(#planeGradient)"/>
      <!-- Wings -->
      <polygon points="40,25 80,10 75,30 40,35" fill="url(#planeGradient)"/>
      <polygon points="55,46 90,60 80,42 55,40" fill="url(#planeGradient)"/>
      <!-- Windows (suggested) -->
      <circle cx="35" cy="38" r="2" fill="#34495E"/>
      <circle cx="45" cy="38" r="2" fill="#34495E"/>
      <circle cx="55" cy="38" r="2" fill="#34495E"/>
      <circle cx="65" cy="38" r="2" fill="#34495E"/>
    </g>
  </g>

  <!-- Text group -->
  <g transform="translate(360,95)">
    <text class="logo-main logo-main-1" font-size="30">
      <tspan x="0" y="0">Simulated aircraft</tspan>
    </text>
    <text class="logo-main logo-main-2" font-size="26">
      <tspan x="0" y="38">telemetry system</tspan>
    </text>
  </g>
</svg>

