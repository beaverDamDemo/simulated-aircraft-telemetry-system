<svg width="640" height="180" viewBox="0 0 640 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="vuePlane" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#41B883"/>
      <stop offset="100%" stop-color="#35495E"/>
    </linearGradient>
    <linearGradient id="vueWaves" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#41B883"/>
      <stop offset="50%" stop-color="#00A8CC"/>
      <stop offset="100%" stop-color="#35495E"/>
    </linearGradient>
    <style>
      .logo-text-main {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-weight: 600;
        fill: #35495E;
        letter-spacing: 0.02em;
      }
    </style>
  </defs>

  <!-- Icon group -->
  <g transform="translate(30,30)">
    <!-- Mountains -->
    <polygon points="0,100 40,40 80,100" fill="#2F855A"/>
    <polygon points="50,100 95,35 140,100" fill="#41B883"/>

    <!-- Telemetry waves -->
    <g transform="translate(80,20)" fill="none" stroke="url(#vueWaves)" stroke-width="4">
      <path d="M0,70 A70,70 0 0 1 90,70" opacity="0.3"/>
      <path d="M10,55 A55,55 0 0 1 80,55" opacity="0.5"/>
      <path d="M20,40 A40,40 0 0 1 70,40" opacity="0.8"/>
    </g>

    <!-- Airplane -->
    <g transform="translate(70,0) rotate(-15)">
      <!-- Fuselage -->
      <rect x="0" y="40" width="110" height="16" rx="8" fill="white" stroke="#35495E" stroke-width="1.5"/>
      <!-- Nose -->
      <path d="M110,40 L132,48 L110,56 Z" fill="white" stroke="#35495E" stroke-width="1.5"/>
      <!-- Tail fin -->
      <polygon points="10,28 36,28 26,48" fill="url(#vuePlane)"/>
      <!-- Wings -->
      <polygon points="42,32 86,16 80,38 42,42" fill="url(#vuePlane)"/>
      <polygon points="56,56 96,72 86,50 56,48" fill="url(#vuePlane)"/>
      <!-- Windows -->
      <circle cx="38" cy="48" r="2" fill="#35495E"/>
      <circle cx="48" cy="48" r="2" fill="#35495E"/>
      <circle cx="58" cy="48" r="2" fill="#35495E"/>
      <circle cx="68" cy="48" r="2" fill="#35495E"/>
    </g>
  </g>

  <!-- Text -->
  <g transform="translate(230,85)">
    <text class="logo-text-main" font-size="26">
      <tspan x="0" y="0">Simulated aircraft telemetry system</tspan>
    </text>
  </g>
</svg>

