services:
  renode:
    build: ./tools/renode
    container_name: telemetry-renode
    volumes:
      - ./firmware:/firmware
    ports:
      - '4321:4321'
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'bash', '-c', 'echo > /dev/tcp/localhost/4321']
      interval: 3s
      timeout: 2s
      retries: 20
      start_period: 5s

  backend:
    build: ./backend
    container_name: telemetry-backend
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - RENODE_UART_HOST=renode
    depends_on:
      renode:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: telemetry-frontend
    ports:
      - '4200:80'
    restart: unless-stopped
